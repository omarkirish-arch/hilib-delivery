<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Methods - Hilib Delivery</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <a href="profile.html" class="icon-button" style="text-decoration: none;"><span class="material-icons-round">arrow_back</span></a>
            <h1 style="font-size: 1.25rem;">Habka Bixinta</h1>
            <div style="width: 44px;"></div> <!-- Spacer -->
        </header>

        <main class="content" style="padding-top: 10px; padding-bottom: 20px;">
            <div style="display: flex; flex-direction: column; gap: 16px;">

                <!-- Payment Method 1: EVC Plus -->
                <div class="card" style="padding: 16px; display: flex; justify-content: space-between; align-items: center; cursor: pointer;">
                    <div style="display: flex; gap: 16px; align-items: center;">
                        <div style="width: 45px; height: 45px; background: linear-gradient(135deg, #00C853, #009688); border-radius: 12px; display: flex; align-items: center; justify-content: center; color: white; font-weight: 700; font-size: 0.9rem; box-shadow: 0 4px 10px rgba(0, 200, 83, 0.2);">
                            EVC
                        </div>
                        <div>
                            <h3 style="font-size: 0.95rem; color: var(--text-primary);">EVC Plus</h3>
                            <p style="font-size: 0.8rem; color: var(--text-secondary); margin-top: 4px;">+252 61XXXXXXX</p>
                        </div>
                    </div>
                    <span class="material-icons-round" style="color: #00D366; font-size: 24px;">check_circle</span>
                </div>

                <!-- Payment Method 2: Zaad -->
                <div class="card" style="padding: 16px; display: flex; justify-content: space-between; align-items: center; cursor: pointer;">
                    <div style="display: flex; gap: 16px; align-items: center;">
                        <div style="width: 45px; height: 45px; background: linear-gradient(135deg, #0277BD, #01579B); border-radius: 12px; display: flex; align-items: center; justify-content: center; color: white; font-weight: 700; font-size: 0.8rem; box-shadow: 0 4px 10px rgba(2, 119, 189, 0.2);">
                            ZAAD
                        </div>
                        <div>
                            <h3 style="font-size: 0.95rem; color: var(--text-primary);">Zaad Service</h3>
                            <p style="font-size: 0.8rem; color: var(--text-secondary); margin-top: 4px;">+252 63XXXXXXX</p>
                        </div>
                    </div>
                </div>

                <!-- Add New Button -->
                <button style="width: 100%; margin-top: 24px; padding: 16px; border-radius: 12px; border: 2px dashed rgba(255, 122, 0, 0.5); background: rgba(255, 122, 0, 0.05); color: var(--accent-orange); font-weight: 700; font-size: 0.95rem; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; transition: background 0.2s;" onmouseover="this.style.background='rgba(255, 122, 0, 0.1)'" onmouseout="this.style.background='rgba(255, 122, 0, 0.05)'" onclick="alert('Ku darida lambar cusub dhawaan ayay imaanaysaa!')">
                    <span class="material-icons-round">add_circle_outline</span>
                    Ku dar Hab Cusub
                </button>

            </div>
        </main>
    </div>
</body>
</html>
