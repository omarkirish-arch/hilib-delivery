<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Hilib Delivery</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        body { margin: 0; padding: 0; background: #f0f2f5; font-family: 'Outfit', sans-serif; }
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .auth-box {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .auth-icon {
            width: 80px;
            height: 80px;
            background: rgba(255,122,0,0.1);
            color: var(--accent-orange);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
        }
        .input-group {
            text-align: left;
            margin-bottom: 20px;
        }
        .input-group label {
            display: block;
            font-size: 0.9rem;
            color: #666;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .input-group input {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid #ddd;
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            box-sizing: border-box;
            background: #fafafa;
        }
        .btn-auth {
            background: var(--accent-orange);
            color: white;
            padding: 16px;
            border-radius: 12px;
            border: none;
            width: 100%;
            font-weight: 700;
            font-size: 1.05rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255,122,0,0.3);
            margin-top: 10px;
        }
        .error-msg {
            color: #FF3B30;
            font-size: 0.9rem;
            margin-bottom: 20px;
            display: none;
            background: #FFEBEE;
            padding: 10px;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-icon">
                <span class="material-icons-round" style="font-size: 40px;">admin_panel_settings</span>
            </div>
            <h1 style="font-size: 1.8rem; color: #333; margin: 0 0 8px 0;">Qaybta Maamulka</h1>
            <p style="color: #666; margin: 0 0 30px 0;">Fadlan geli xogta maamulaha (Admin)</p>

            <div id="errorMsg" class="error-msg">Magaca ama Password-ka waa khalad!</div>
            
            <div class="input-group">
                <label>Magaca Maamulaha (Username)</label>
                <input type="text" id="adminUser" placeholder="Tusaale: admin">
            </div>
            <div class="input-group">
                <label>Furaha (Password)</label>
                <input type="password" id="adminPass" placeholder="••••••••">
            </div>

            <button class="btn-auth" onclick="loginAdmin()">Gal (Login)</button>
        </div>
    </div>

    <script>
        function loginAdmin() {
            const user = document.getElementById('adminUser').value.trim();
            const pass = document.getElementById('adminPass').value.trim();
            const errorMsg = document.getElementById('errorMsg');

            if (user === 'admin' && pass === 'admin123') {
                localStorage.setItem('hilib_admin_logged_in', 'true');
                window.location.href = 'admin-dashboard.html';
            } else {
                errorMsg.style.display = 'block';
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('hilib_admin_logged_in') === 'true') {
                window.location.href = 'admin-dashboard.html';
            }
        });
    </script>
</body>
</html>
