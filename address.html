<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Addresses - Hilib Delivery</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <a href="profile.html" class="icon-button" style="text-decoration: none;"><span class="material-icons-round">arrow_back</span></a>
            <h1 style="font-size: 1.25rem;">Cinwaanadaada</h1>
            <div style="width: 44px;"></div> <!-- Spacer -->
        </header>

        <main class="content" style="padding-top: 10px; padding-bottom: 20px;">
            <div style="display: flex; flex-direction: column; gap: 16px;">

                <!-- Address 1: Home -->
                <div class="card" style="padding: 16px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; border: 1px solid var(--accent-orange);">
                    <div style="display: flex; gap: 16px; align-items: flex-start;">
                        <div style="width: 40px; height: 40px; background: rgba(255, 122, 0, 0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--accent-orange);">
                            <span class="material-icons-round" style="font-size: 20px;">home</span>
                        </div>
                        <div>
                            <div style="display: flex; align-items: center; gap: 8px;">
                                <h3 style="font-size: 0.95rem; color: var(--text-primary);">Guriga (Home)</h3>
                                <span style="background: var(--accent-orange); color: white; padding: 2px 6px; border-radius: 4px; font-size: 0.65rem; font-weight: 700;">DEFAULT</span>
                            </div>
                            <p style="font-size: 0.8rem; color: var(--text-secondary); margin-top: 6px; line-height: 1.4;">Wadada Taleex, Degmada Hodan<br>Mogadishu, Somalia</p>
                        </div>
                    </div>
                </div>

                <!-- Address 2: Office -->
                <div class="card" style="padding: 16px; display: flex; justify-content: space-between; align-items: center; cursor: pointer;">
                    <div style="display: flex; gap: 16px; align-items: flex-start;">
                        <div style="width: 40px; height: 40px; background: var(--bg-color); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--text-secondary);">
                            <span class="material-icons-round" style="font-size: 20px;">business</span>
                        </div>
                        <div>
                            <h3 style="font-size: 0.95rem; color: var(--text-primary);">Xafiiska (Office)</h3>
                            <p style="font-size: 0.8rem; color: var(--text-secondary); margin-top: 6px; line-height: 1.4;">Jidka Maka Al Mukarama<br>Hawlwadaag, Mogadishu</p>
                        </div>
                    </div>
                </div>

                <!-- Add New Button -->
                <button style="width: 100%; margin-top: 24px; padding: 16px; border-radius: 12px; border: 2px dashed rgba(255, 122, 0, 0.5); background: rgba(255, 122, 0, 0.05); color: var(--accent-orange); font-weight: 700; font-size: 0.95rem; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; transition: background 0.2s;" onmouseover="this.style.background='rgba(255, 122, 0, 0.1)'" onmouseout="this.style.background='rgba(255, 122, 0, 0.05)'" onclick="alert('Ku darida cinwaan cusub dhawaan ayay imaanaysaa!')">
                    <span class="material-icons-round">add_location_alt</span>
                    Ku dar Cinwaan Cusub
                </button>

            </div>
        </main>
    </div>
</body>
</html>
